spring.application.name=AgentSandboxMCP
spring.ai.mcp.server.protocol=STREAMABLE
# The MCP endpoint requires an API key. It is still loopback-only by default;
# set server.address explicitly if a reverse proxy or another host must reach it.
server.address=127.0.0.1
# sandbox-mcp.web.password (or SANDBOX_MCP_WEB_PASSWORD) is required and remains
# authoritative on every startup. The default user is admin.
